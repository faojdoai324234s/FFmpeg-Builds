name: Ubuntu Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
        
    - name: Build image
      run: |
        ./makeimage.sh win64 nonfree
        
    - name: Build FFmpeg
      shell: bash
      run: |
        ./build.sh win64 nonfree
